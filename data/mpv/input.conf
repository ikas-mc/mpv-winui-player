RIGHT            osd-msg-bar seek  2 relative+exact
LEFT             osd-msg-bar seek -2 relative+exact
UP               osd-msg add volume 2
DOWN             osd-msg add volume -2

SPACE            cycle pause

PGDWN            playlist-next
PGUP             playlist-prev

.                frame-step
,                frame-back-step

ENTER            show-progress
ESC              set fullscreen no

F1               script-binding stats/display-page-1-toggle
F2               script-binding stats/display-page-5-toggle
F3               script-binding stats/display-stats-toggle

F11              cycle fullscreen
