Playback
	Display duration
		1 second	set image-display-duration 1
		2 seconds	set image-display-duration 2
		5 seconds	set image-display-duration 5
		10 seconds	set image-display-duration 10
		Infinite	set image-display-duration inf
	Speed
		25%	set speed 0.25
		50%	set speed 0.50
		75%	set speed 0.75
		100%	set speed 1
		125%	set speed 1.25
		150%	set speed 1.50
		175%	set speed 1.75
		200%	set speed 2
		400%	set speed 4
		800%	set speed 8
	Set/clear A-B loop points	ab-loop
	Loop file	cycle-values loop-file inf no
	Loop playlist	cycle-values loop-playlist inf no
	Next chapter	add chapter 1
	Previous chapter	add chapter -1
	Next Frame	frame-step
	Previous Frame	frame-back-step
	Reload	set file-local-options/start ${=time-pos}; playlist-play-index current yes; show-text "Reloading current file..."
	Next file	playlist-next
	Previous file	playlist-prev
	Next sub-playlist	playlist-next-playlist
	Previous sub-playlist	playlist-prev-playlist
	Shuffle	playlist-shuffle
	Unshuffle	playlist-unshuffle
	Toggle fps60	vf toggle lavfi="fps=fps=60/1.001"
Video
	Fill	no-osd cycle-values panscan 0 1; no-osd set video-unscaled no; no-osd set video-zoom 0
	Stretch	no-osd cycle keepaspect
	Unscaled	no-osd cycle-values video-unscaled yes no; no-osd set video-zoom 0; no-osd set panscan 0
	Zoom
		50%	set video-zoom -1
		100%	set video-zoom  0
		200%	set video-zoom  1
	Aspect ratio
		16:9	set video-aspect-override 16:9
		4:3	set video-aspect-override 4:3
		2.35:1	set video-aspect-override 2.35:1
		Default	set video-aspect-override no
	Center	no-osd set video-pan-x 0; no-osd set video-pan-y 0; no-osd set video-align-x 0; no-osd set video-align-y 0
	Rotate clockwise	cycle-values video-rotate 90 180 270 0
	Rotate counterclockwise	cycle-values video-rotate 270 180 90 0
	Deband	cycle deband
	Deinterlace	cycle deinterlace
	Screenshot	screenshot
	Screenshot without subtitles	screenshot video
Audio
	Channels
		Auto	set audio-channels auto-safe
		Stereo	set audio-channels stereo
		Mono	set audio-channels mono
	Increase volume	add volume  2
	Decrease volume	add volume -2
	Mute	cycle mute
	Increase delay	add audio-delay  0.1
	Decrease delay	add audio-delay -0.1
Subtitle
	Visible	cycle sub-visibility
	Increase delay	add sub-delay  0.1
	Decrease delay	add sub-delay -0.1
	Scale up	add sub-scale  0.1
	Scale down	add sub-scale -0.1
	Lines	script-binding select/select-subtitle-line
	Secondary subtitle
		Visible	cycle secondary-sub-visibility
		Increase delay	add secondary-sub-delay  0.1
		Decrease delay	add secondary-sub-delay -0.1
		Lines	script-binding select/select-secondary-subtitle-line
Tools
	Playback statistics	script-binding stats/display-page-1-toggle
	File information	script-binding stats/display-page-5-toggle
	View Key bindings	script-binding stats/display-page-4-toggle
	Time OSD	no-osd cycle-values osd-level 3 1
	Copy path	osd-auto set clipboard/text ${path}
	Copy subtitle	set clipboard/text ${sub-text}
	Copy title	set clipboard/text ${media-title}
	Key bindings	script-binding select/select-binding
	Properties	script-binding select/show-properties
	Console	script-binding commands/open
	Edit config file	script-binding select/edit-config-file
	Edit key bindings	script-binding select/edit-input-conf
	Debug	script-message-to debug show
	Draw	script-binding click-preview
	Toggle gpu/gpu-next	cycle-values vo gpu gpu-next
	Hwdec
		auto	set hwdec auto
		d3d11va	set hwdec d3d11va
		d3d11va-copy	set hwdec d3d11va-copy
		d3d12va-copy	set hwdec d3d12va-copy
		no	set hwdec no
Shaders
